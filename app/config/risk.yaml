risk:
  max_risk_per_trade: 0.005     # 0.5% of balance
  max_daily_loss: 0.02          # 2% of day-start equity
  max_open_positions: 5
  max_correlated_exposure: 2    # max positions sharing a currency leg
  min_rr: 1.5
  max_spread_multiplier: 3.0    # reject if spread > 3x normal
  max_drawdown: 0.10
  max_consecutive_losses: 2             # Two-Strike Rule: halt for today after 2 consecutive losses
  allow_micro_lot_small_account: true   # enables 0.01 micro-lot for balances < $200
  max_small_account_risk_pct: 0.08      # max 8% dollar loss cap per micro trade
  max_small_account_daily_loss: 0.12    # allows 2 micro-lot losses (~$3.60 on $30) before daily halt
  min_trading_balance: 12.0             # hard survival floor: stop trading if balance drops below $12

